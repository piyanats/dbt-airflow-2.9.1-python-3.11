name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  test-dbt:
    name: Test dbt Models
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dbt dependencies
        run: |
          pip install dbt-core==1.7.7 dbt-bigquery==1.7.4

      - name: dbt deps
        working-directory: ./dbt_project
        run: dbt deps

      - name: dbt compile
        working-directory: ./dbt_project
        run: dbt compile --target dev --profiles-dir .
        env:
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          DBT_DATASET: analytics_dev

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install flake8 black

      - name: Run flake8
        run: flake8 dags/ --max-line-length=120 --exclude=__pycache__

      - name: Check formatting with black
        run: black --check dags/

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test-dbt, lint]
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: airflow-dbt:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

