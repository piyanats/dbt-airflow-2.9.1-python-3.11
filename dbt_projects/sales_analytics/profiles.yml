sales_analytics:
  target: prod
  outputs:
    prod:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID', 'your-gcp-project-id') }}"
      dataset: "{{ env_var('SALES_DATASET', 'sales_analytics') }}"
      threads: 4
      timeout_seconds: 300
      location: "{{ env_var('GCP_LOCATION', 'asia-southeast1') }}"
      priority: interactive
      retries: 1
      # Use project-specific service account key file
      keyfile: "{{ env_var('SALES_SERVICE_ACCOUNT_KEY', env_var('GOOGLE_APPLICATION_CREDENTIALS', '')) }}"
      # Or use service account email for Workload Identity
      # impersonate_service_account: "{{ env_var('SALES_SERVICE_ACCOUNT_EMAIL', '') }}"
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID', 'your-gcp-project-id') }}"
      dataset: "{{ env_var('SALES_DATASET', 'sales_analytics_dev') }}"
      threads: 2
      timeout_seconds: 300
      location: "{{ env_var('GCP_LOCATION', 'asia-southeast1') }}"
      priority: interactive
      retries: 1
      keyfile: "{{ env_var('SALES_SERVICE_ACCOUNT_KEY', env_var('GOOGLE_APPLICATION_CREDENTIALS', '')) }}"

