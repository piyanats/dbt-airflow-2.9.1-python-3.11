name: 'dbt_airflow_project'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_airflow_project'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Configuring models
models:
  dbt_airflow_project:
    # Config indicated by + and applies to all files under models/staging/
    staging:
      +materialized: view
      +schema: staging
    # Config indicated by + and applies to all files under models/marts/
    marts:
      +materialized: table
      +schema: marts

# Vars for the project
vars:
  # The `start_date` variable will be accessible in all models
  start_date: '2024-01-01'
